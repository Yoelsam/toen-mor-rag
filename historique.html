<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>historique</title><style>body{background:#0a0e14;color:#e8e8e8;font-family:Heebo,sans-serif;direction:rtl;margin:0}nav{background:#111722;border-bottom:1px solid rgba(201,162,39,.22);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between}nav a{color:#c9a227;text-decoration:none;font-weight:700}.c{max-width:800px;margin:32px auto;padding:0 20px}h1{color:#c9a227;margin-bottom:20px}.item{background:#1a2332;border:1px solid rgba(201,162,39,.22);border-radius:12px;padding:18px;margin-bottom:14px}.q{color:#c9a227;font-weight:700;margin-bottom:8px}.a{color:#8a9bb0;font-size:.88em;line-height:1.6;white-space:pre-wrap}.d{color:#555;font-size:.75em;margin-top:8px}</style></head><body><nav><a href="/">חזרה לחיפוש</a><a href="/auth/logout">יציאה</a></nav><div class="c"><h1>היסטוריית חיפושים</h1><div id="list">טוען...</div></div><script>fetch("/history").then(function(r){return r.json()}).then(function(h){var L=document.getElementById("list");if(h.error){L.textContent="לא מחובר";return}if(h.length===0){L.textContent="אין חיפושים שמורים";return}L.innerHTML="";h.forEach(function(i){var d=document.createElement("div");d.className="item";var q=document.createElement("div");q.className="q";q.textContent=i.question;var a=document.createElement("div");a.className="a";a.textContent=(i.answer||"").slice(0,400);var dt=document.createElement("div");dt.className="d";dt.textContent=(i.created_at||"").slice(0,10);var btn=document.createElement("button");btn.textContent="🗑️";btn.style.cssText="float:left;background:transparent;border:1px solid #c9a227;color:#c9a227;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:0.85em;";btn.onclick=function(){if(!confirm("למחוק חיפוש זה?"))return;fetch("/history/"+i.id,{method:"DELETE"}).then(function(r){return r.json()}).then(function(){d.remove()})};d.appendChild(btn);d.appendChild(q);d.appendChild(a);d.appendChild(dt);L.appendChild(d)})}).catch(function(e){document.getElementById("list").textContent="שגיאה: "+e.message})</script></body></html>
